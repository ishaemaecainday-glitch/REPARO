<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <title>Reparo - Book Repair</title>
  <link rel="stylesheet" href="styles.css">
  
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>
  <style>
    .book-page-body [hidden] {
      display: none !important;
    }

    .book-page-body .provider-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
    }

    .book-page-body .provider-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .book-page-body .provider-avatar {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      box-sizing: border-box;
      object-fit: cover;
      border-radius: 12px;
    }

    #bookingAvatarFallback {
      background: #e5f7f2;
      padding: 10px;
      fill: #2cb396;
    }

    .book-page-body .provider-text {
      min-width: 0;
    }

    .book-page-body .provider-text h2 {
      margin: 0 0 5px;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .book-page-body .provider-text p {
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 5px 10px;
      font-size: 12px;
    }

    .book-page-body .close-btn {
      flex-shrink: 0;
    }

    .book-page-body .book-form {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    .book-page-body .form-input,
    .book-page-body .form-textarea {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
    }

    .book-page-body .rate-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    #bookingEstimatedRate {
      text-align: right;
      overflow-wrap: anywhere;
    }

    #bookingFormStatus {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }

    #bookingSubmit {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    #bookingSubmit svg {
      flex-shrink: 0;
    }

    #bookingSubmit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
  </style>
  <link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#33af9c">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>

<body class="book-page-body">
  <div class="book-container">

    <div class="book-header-bg">
      <button
        type="button"
        class="back-btn"
        data-back-to-provider
        aria-label="Go back"
      >
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="#FFF"
          aria-hidden="true"
        >
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </button>
    </div>

    <div class="book-card">
      <div class="drag-handle"></div>

      <!-- PROVIDER HEADER -->
      <div class="provider-bar">
        <div class="provider-info">
          <svg
            id="bookingAvatarFallback"
            class="provider-avatar"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>

          <img
            id="bookingProviderPhoto"
            class="provider-avatar"
            alt=""
            hidden
          >

          <div class="provider-text">
            <h2 id="bookingProviderName">Loading provider…</h2>
            <p>
              <span id="bookingProviderCategory"></span>
              <span id="bookingProviderPrice"></span>
            </p>
          </div>
        </div>


      </div>
      <!-- PROVIDER HEADER ENDS HERE -->

      <!-- FORM IS BELOW THE HEADER -->
      <form class="book-form">
        <p id="bookingFormStatus" role="status">
          Loading provider information…
          <div class="form-group">
  <label for="service">
    What service do you need?
    <span class="required">*</span>
  </label>

  <input
    type="text"
    id="service"
    name="service"
    class="form-input"
    placeholder="e.g. Repair a broken light"
    required
  >
</div>
        </p>

      <div class="form-group">
  <label id="bookingLocationLabel">
    Your Location <span class="required">*</span>
  </label>

  <div
    class="location-box booking-location-panel"
    role="group"
    aria-labelledby="bookingLocationLabel"
  >
    <div class="pin-circle">
      <svg
        viewBox="0 0 24 24"
        width="22"
        height="22"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
        <circle cx="12" cy="9" r="2.5"/>
      </svg>
    </div>

    <h3 id="bookingLocationTitle">Detect Your Location</h3>

    <p id="bookingLocationName" role="status">
      Use your device GPS to find your area.
    </p>

    <div id="bookingMapWrap" hidden>
      <div
        id="bookingLocationMap"
        aria-label="Map of your detected booking location"
      ></div>
    </div>

    <p id="bookingLocationAccuracy"></p>

    <button type="button" class="location-btn">
      Use My Location
    </button>
  </div>
</div>
        <div class="form-group">
          <label for="datetime">
            Preferred Date &amp; Time
            <span class="required">*</span>
          </label>

          <div class="select-wrapper">
            <input
              type="datetime-local"
              id="datetime"
              class="form-input datetime-input"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="notes">Additional Notes (optional)</label>
          <textarea
            id="notes"
            class="form-textarea"
            placeholder="Any special instructions or details about the problem."
          ></textarea>
        </div>

        <div class="form-group">
          <label>Payment Method</label>
          <div class="payment-box">
            CASH ONHAND PAYMENT ONLY.
          </div>
        </div>

        <div class="rate-banner">
          <div class="rate-text">
            <h4>Estimated Rate</h4>
            <p>Final price agreed with provider.</p>
          </div>

          <div class="rate-price" id="bookingEstimatedRate">…</div>
        </div>

        <div class="form-submit-wrapper">
          <button
            type="submit"
            class="submit-btn"
            id="bookingSubmit"
            disabled
          >
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="currentColor"
              aria-hidden="true"
            >
              <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
            </svg>
            Submit Booking Request
          </button>

          <span class="submit-note">
            Fill in all required fields to continue
          </span>
        </div>
      </form>

    </div>
  </div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module" src="js/reparo-app.js"></script>
  <script>
  const selectedProviderId =
    new URLSearchParams(window.location.search).get("provider");

  const providerProfileURL = selectedProviderId
    ? `service.html?provider=${encodeURIComponent(selectedProviderId)}`
    : "search.html";

  document.querySelectorAll("[data-back-to-provider]")
    .forEach(button => {
      button.addEventListener("click", () => {
        window.location.href = providerProfileURL;
      });
    });
</script>
</body>
</html>
