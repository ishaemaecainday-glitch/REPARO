<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <title>Reparo - My Bookings</title>
  <link rel="stylesheet" href="styles.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#33af9c">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>

<body>
  <div class="mobile-wrapper">

    <main class="bookings-container">
      <div class="bookings-header">
        <h1>My Bookings</h1>
        <p>Track your service appointments</p>
      </div>

   <div class="tabs-wrapper" aria-label="Filter bookings">
  <button type="button" class="tab-btn active"
          data-booking-tab="all" aria-pressed="true">
    All <span class="tab-badge" hidden></span>
  </button>
        <button
          type="button"
        class="tab-btn"
data-booking-tab="pending"
aria-pressed="false"
        
        >
          Pending
          <span class="tab-badge" hidden></span>
        </button>

        <button
          type="button"
          class="tab-btn"
          data-booking-tab="confirmed"
          aria-pressed="false"
        >
          Confirmed
          <span class="tab-badge" hidden></span>
        </button>

        <button
          type="button"
          class="tab-btn"
          data-booking-tab="completed"
          aria-pressed="false"
        >
          Completed
          <span class="tab-badge" hidden></span>
        </button>

<button
  type="button"
  class="tab-btn"
  data-booking-tab="declined"
  aria-pressed="false"
>
  Declined
  <span class="tab-badge" hidden></span>
</button>

<button
  type="button"
  class="tab-btn"
  data-booking-tab="cancelled"
  aria-pressed="false"
>
  Cancelled
  <span class="tab-badge" hidden></span>
</button>
        <button
          type="button"
          class="tab-btn"
          data-booking-tab="report"
          aria-pressed="false"
        >
          Report
          <span class="tab-badge" hidden></span>
        </button>

               </button>
      </div>

      <p id="bookingStatus" role="status" hidden></p>

      <!-- Actual bookings are rendered here by reparo-app.js. -->
      <div
        class="bookings-list"
        id="customerBookingList"
      ></div>
    </main>

    <!-- CHAT -->
    <a
      href="message.html"
      class="floating-chat"
      aria-label="Open Chat"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
      </svg>
    </a>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="index.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        <span>Home</span>
      </a>

      <a href="search.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <span>Search</span>
      </a>

      <a
        href="post.html"
        class="fab-btn"
        aria-label="Post a Request"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
      </a>

      <a
        href="mybooking.html"
        class="nav-item active"
        aria-current="page"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/>
        </svg>
        <span>Booking</span>
      </a>

      <a href="myprofile.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
        <span>Profile</span>
      </a>
    </nav>

  </div>

  <script type="module" src="js/reparo-app.js"></script>
  <script type="module" src="js/customer-reports.js"></script>
</body>
</html>
