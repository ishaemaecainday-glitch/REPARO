<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Reparo - Bookings</title>
  <link rel="stylesheet" href="provider-bookings.css">
 <link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#33af9c">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>

<body>
  <svg class="icon-definitions"
       xmlns="http://www.w3.org/2000/svg"
       aria-hidden="true">

    <symbol id="home" viewBox="0 0 24 24">
      <path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/>
    </symbol>

    <symbol id="calendar" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="16" rx="2"/>
      <path d="M7 3v4m10-4v4M3 11h18"/>
    </symbol>

    <symbol id="chat" viewBox="0 0 24 24">
      <path d="M4 3h16v14H8l-4 4V3Z"/>
      <path d="M8 8h8m-8 4h5"/>
    </symbol>

    <symbol id="person" viewBox="0 0 24 24">
      <circle cx="12" cy="7" r="4"/>
      <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
    </symbol>

    <symbol id="bell" viewBox="0 0 24 24">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
    </symbol>

    <symbol id="clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 7v5l3 2"/>
    </symbol>

    <symbol id="pin" viewBox="0 0 24 24">
      <path d="M19 9c0 5-7 12-7 12S5 14 5 9a7 7 0 1 1 14 0Z"/>
      <circle cx="12" cy="9" r="2"/>
    </symbol>

    <symbol id="search" viewBox="0 0 24 24">
      <circle cx="10" cy="10" r="6"/>
      <path d="m15 15 6 6"/>
    </symbol>
  </svg>

  <div class="booking-app">
    <header class="booking-header">
      <div class="heading-row">
        <div>
          <p class="eyebrow">PROVIDER WORKSPACE</p>
          <h1>Bookings</h1>
        </div>

        <a href="notification.html"
           class="round-button"
           aria-label="Notifications">
          <svg aria-hidden="true">
            <use href="#bell"/>
          </svg>
        </a>
      </div>

      <p>Manage your customer requests and scheduled work.</p>

      <label class="search-box">
        <svg aria-hidden="true">
          <use href="#search"/>
        </svg>

        <input
          id="bookingSearch"
          type="search"
          placeholder="Search your bookings"
          aria-label="Search bookings"
        >
      </label>
    </header>

    <main>
      <div class="filters" aria-label="Filter bookings">
        <button type="button" data-filter="all" aria-pressed="true">
          All <span>…</span>
        </button>

        <button type="button" data-filter="pending" aria-pressed="false">
          Pending <span>…</span>
        </button>

        <button type="button" data-filter="confirmed" aria-pressed="false">
          Confirmed <span>…</span>
        </button>

        <button type="button" data-filter="completed" aria-pressed="false">
          Completed <span>…</span>
        </button>

        <button type="button" data-filter="declined" aria-pressed="false">
          Declined <span>…</span>
        </button>

            <button type="button" data-filter="cancelled" aria-pressed="false">
          Cancelled <span>…</span>
        </button>

        <button type="button" data-filter="report" aria-pressed="false">
          Report <span>…</span>
        </button>
      </div>

      <p id="bookingStatus" role="status" hidden></p>

      <div id="bookingList" aria-busy="true"></div>
    </main>

 <nav class="bottom-nav" aria-label="Provider navigation">
  <a href="rm-index.html" class="nav-link">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/>
    </svg>
    <span>Home</span>
  </a>

  <a href="rm-booking.html" class="nav-link">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="5" width="18" height="16" rx="2"/>
      <path d="M7 3v4m10-4v4M3 11h18"/>
    </svg>
    <span>Booking</span>
  </a>

  <a href="message.html?from=provider" class="nav-link">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 3h16v14H8l-4 4V3Z"/>
      <path d="M8 8h8m-8 4h5"/>
    </svg>
    <span>Message</span>
  </a>

  <a href="rm-profile.html" class="nav-link">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="7" r="4"/>
      <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
    </svg>
    <span>Profile</span>
  </a>
</nav>
  </div>
<dialog id="completeBookingDialog" class="complete-dialog" aria-labelledby="completeBookingTitle">
  <h2 id="completeBookingTitle">Complete this service?</h2>
  <p>Confirm that the work for this booking is finished.</p>
  <div class="complete-dialog-actions">
    <button id="keepBookingOpen" type="button">Not yet</button>
    <button id="confirmBookingComplete" type="button">Yes, mark as done</button>
  </div>
</dialog>

<dialog id="reportCustomerDialog" class="report-dialog">
  <form id="reportCustomerForm">
    <h2>Report Customer</h2>

    <p>
      Describe what happened with this booking.
      Your report will be saved for administrator review.
    </p>

    <label for="reportReason">Reason</label>
    <select id="reportReason" required>
      <option value="">Select a reason</option>
      <option value="non_payment">Non-payment</option>
      <option value="suspected_scam">Suspected scam</option>
      <option value="harassment">Harassment or abusive behavior</option>
      <option value="false_information">False booking information</option>
      <option value="other">Other problem</option>
    </select>

    <label for="reportDetails">What happened?</label>
    <textarea
      id="reportDetails"
      rows="5"
      minlength="10"
      maxlength="2000"
      placeholder="Explain the issue with this booking."
      required
    ></textarea>

    <p id="reportFeedback" role="status"></p>

    <div class="report-dialog-actions">
      <button id="cancelReport" type="button">Cancel</button>
      <button id="submitReport" type="submit">Submit Report</button>
    </div>
  </form>
</dialog>
  <script type="module" src="js/provider-bookings.js"></script>

</body>
</html>
