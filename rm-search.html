<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reparo - Search</title>
    <link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#33af9c">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="repairmen.css">
   
</head>
<body>
<div class="drawer-user-info">
    <h3 class="profile-fullname">User</h3>
    <span>Customer</span>
</div>
    <div class="mobile-container">
        <!-- Search Header -->
        <header class="search-header-container">
            <div class="search-box-wrapper">
                <svg class="search-input-icon" viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input type="text" class="search-input" placeholder="Search electrician, plumber....">
            </div>
            <p class="search-subtitle">Find trusted repair services near you.</p>
        </header>

        <!-- Main Content Area -->
        <main class="dashboard-content">
            <div class="section-header-flex">
                <h2 class="section-title" style="margin-bottom: 0;">Recent Searches</h2>
                <a href="#" class="clear-link">Clear all</a>
                
            </div>

           <div class="recent-search-list" id="recentSearchList"></div>
           
            <!-- Pro Tip Card -->
            <div class="pro-tip-card">
                <div class="pro-tip-icon">💡</div>
                <div>
                    <h3 class="pro-tip-title">Pro tip</h3>
                    <p class="pro-tip-desc">Try searching by service type like “electrician” or by location like plumber centro for better results.</p>
                </div>
            </div>
        </main>

        <!-- Floating Chat FAB -->
        <div class="floating-chat-container">
            <button class="chat-fab" aria-label="Messages">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                <span class="chat-badge">3</span>
            </button>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="rm-index.html" class="nav-link active">
                <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
                <span>Dashboard</span>
            </a>
            <a href="rm-search.html" class="nav-link">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <span>Search</span>
            </a>
            <a href="rm-booking.html" class="nav-link">
                <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
                <span>Booking</span>
            </a>
            <a href="rm-profile.html" class="nav-link">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>Profile</span>
            </a>
        </nav>
    </div>


<script type="module" src="js/reparo-app.js"></script>
</body>
</html>
