<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <title>Chat - Reparo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="chat.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#33af9c">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>

<body class="reparo-chat-body">
  <div class="app-container chat-page">

    <header class="page-header chat-header">
      <div class="header-left">

      <a href="message.html" class="back-btn" aria-label="Back to Messages">
        
  <svg
    viewBox="0 0 24 24"
    width="20"
    height="20"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M19 12H5m7-7-7 7 7 7"/>
  </svg>
</a>

        <div class="user-info">
          <div class="chat-avatar">
            <img id="chatPeerPhoto" alt="" hidden>

            <svg
              id="chatPeerFallback"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.4 0-8 2-8 4.5V21h16v-2.5c0-2.5-3.6-4.5-8-4.5Z"/>
            </svg>
          </div>

          <div class="header-titles">
            <h1>Loading conversation…</h1>
            <p class="subtitle"></p>
          </div>
        </div>
      </div>

      <a
        id="chatPhoneLink"
        class="chat-round-button"
        aria-label="Call provider"
        hidden
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.1 5.2 2 2 0 0 1 5.1 3h3a1 1 0 0 1 1 1c0 1 .2 2 .5 2.9a1 1 0 0 1-.2 1L7.8 9.5a16 16 0 0 0 6.7 6.7l1.6-1.6a1 1 0 0 1 1-.2c.9.3 1.9.5 2.9.5a2 2 0 0 1 2 2Z"/>
        </svg>
      </a>
    </header>

    <div id="chatBookingBanner" class="chat-booking-banner" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="5" width="16" height="16" rx="2"/>
        <path d="M8 3v4m8-4v4M4 11h16m-12 5 2 2 5-5"/>
      </svg>

      <div>
        <span id="chatBookingText"></span>
        <strong id="chatBookingState"></strong>
      </div>
    </div>

    <main class="content chat-messages live-chat-messages">
      <p class="chat-empty-note">Loading messages…</p>
    </main>

    <p id="chatStatus" role="status" hidden></p>

    <div id="chatAttachmentMenu" class="chat-attachment-menu" hidden>
      <button type="button" id="chatChoosePhoto">
        <span class="attachment-icon photo-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8" cy="8" r="1.5"/>
            <path d="m4 17 5-5 4 4 3-3 5 5"/>
          </svg>
        </span>
        Photo
      </button>

      <button type="button" id="chatSendLocation">
        <span class="attachment-icon location-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </span>
        Location
      </button>
    </div>

    <input
      type="file"
      id="chatPhotoInput"
      accept="image/jpeg,image/png,image/webp"
      hidden
    >

    <div id="chatPhotoPreview" class="chat-photo-preview" hidden>
      <img id="chatPhotoPreviewImage" alt="Selected photo">

      <div>
        <button type="button" id="chatCancelPhoto">Cancel</button>
        <button type="button" id="chatConfirmPhoto">Send Photo</button>
      </div>
    </div>

    <footer class="chat-footer">
      <button
        type="button"
        id="chatAttachmentToggle"
        class="chat-round-button"
        aria-label="Show attachment options"
        aria-controls="chatAttachmentMenu"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>

      <input
        type="text"
        class="chat-input"
        placeholder="Type a message…"
        aria-label="Message"
        maxlength="2000"
        autocomplete="off"
      >

      <button
        type="button"
        class="chat-round-button chat-send"
        aria-label="Send message"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m3 3 19 9-19 9 4-9-4-9Zm4 9h15"/>
        </svg>
      </button>
    </footer>

  </div>

  <script type="module" src="js/reparo-app.js"></script>
</body>
</html>
