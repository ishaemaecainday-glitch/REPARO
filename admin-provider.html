  <!-- MAIN DASHBOARD AREA -->
  <main class="admin-main">
    
    <!-- HEADER BAR -->
    <header class="top-bar">
      <div class="header-title">
        <h1>Registered Provider</h1>
       <p id="registeredProviderDate"></p>
      </div>

      <div class="header-actions">
        <div class="search-bar-box">
          <svg viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" placeholder="Search.....">
        </div>
        <div class="notification-circle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="var(--admin-text-dark)">
            <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
          </svg>
          <span class="badge">2</span>
        </div>
      </div>
    </header>

    <!-- TABLE CONTAINER CARD -->
    <section class="approval-card-container">
      
      <!-- REGISTERED PROVIDERS TABLE -->
      <table class="approval-table">
        <thead>
          <tr>
            <th>ProviderID</th>
            <th>Shop Name</th>
            <th>Services</th>
            <th>Location</th>
            <th>Joined</th>
          </tr>
        </thead>
       <tbody>
  <tr>
    <td colspan="5">Connecting to Firestore…</td>
  </tr>
</tbody>
      </table>

    </section>

  </main>
