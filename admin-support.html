<style>
  .admin-main > .live-support {
    display: grid;
    grid-template-columns: minmax(230px, 0.85fr) minmax(0, 1.65fr);
    align-items: stretch;
    gap: 20px;
    margin-top: 24px;
    width: 100%;
    min-width: 0;
  }

  .live-support,
  .live-support * {
    box-sizing: border-box;
  }

  .live-support .live-support-list,
  .live-support .live-support-thread {
    min-width: 0;
    background: #eff2f6;
    border-radius: 16px;
    padding: 20px;
  }

  .live-support .live-support-list {
    max-height: 580px;
    overflow-y: auto;
  }

  .live-support .live-support-thread {
    display: flex;
    flex-direction: column;
    height: 580px;
    min-height: 380px;
  }

  .live-support h3 {
    margin: 0;
    padding-bottom: 18px;
    color: #172b3a;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }

  .live-support #supportPeerName {
    border-bottom: 1px solid #dce4ec;
  }

  .live-support #supportPeers {
    color: #64748b;
    font-size: 13px;
    line-height: 1.6;
  }

  .live-support .live-support-peer {
    display: block;
    width: 100%;
    margin: 0 0 12px;
    padding: 15px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: #fff;
    text-align: left;
    font: inherit;
    cursor: pointer;
  }

  .live-support .live-support-peer:hover,
  .live-support .live-support-peer[aria-pressed="true"] {
    background: #e2f6f1;
    border-color: #9eddd1;
  }

  .live-support .live-support-peer strong {
    display: block;
    color: #172b3a;
    font-size: 14px;
    overflow-wrap: anywhere;
  }

  .live-support .live-support-peer span {
    display: block;
    margin-top: 5px;
    overflow: hidden;
    color: #64748b;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 12px;
  }

  .live-support .live-chat-messages {
    display: flex;
    flex: 1;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    min-height: 0;
    margin: 0;
    padding: 22px 0;
    overflow-y: auto;
    color: #64748b;
    font-size: 13px;
    line-height: 1.6;
  }

  .live-support .live-chat-bubble {
    flex-shrink: 0;
    align-self: flex-start;
    max-width: 82%;
    padding: 12px 15px;
    border-radius: 14px 14px 14px 4px;
    background: #fff;
    color: #243444;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .live-support .live-chat-bubble.sent {
    align-self: flex-end;
    border-radius: 14px 14px 4px 14px;
    background: #33af9c;
    color: #fff;
  }

  .live-support .live-support-compose {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    gap: 10px;
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid #dce4ec;
  }

  .live-support #supportInput {
    flex: 1;
    width: 100%;
    min-width: 0;
    height: 44px;
    padding: 0 14px;
    border: 1px solid #d6dfe6;
    border-radius: 12px;
    background: #fff;
    color: #243444;
    font: inherit;
    font-size: 13px;
  }

  .live-support #supportInput:focus {
    outline: 2px solid #33af9c;
    outline-offset: 2px;
  }

  .live-support #supportSend {
    flex-shrink: 0;
    height: 44px;
    padding: 0 20px;
    border: 0;
    border-radius: 12px;
    background: #33af9c;
    color: #fff;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .live-support #supportSend:disabled {
    background: #cbd5e1;
    color: #64748b;
    cursor: default;
  }

  .live-support #supportInput:disabled {
    background: #f7f9fb;
    cursor: default;
  }

  .live-support #supportError {
    margin: 10px 0 0;
    color: #b42318;
    font-size: 13px;
    overflow-wrap: anywhere;
  }

  .live-support #supportError:empty {
    display: none;
  }

  @media (max-width: 900px) {
    .admin-main > .live-support {
      grid-template-columns: minmax(0, 1fr);
    }

    .live-support .live-support-list {
      max-height: 240px;
    }

    .live-support .live-support-thread {
      height: 480px;
    }
  }
</style>
