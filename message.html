<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reparo - Messages</title>
  <link rel="stylesheet" href="styles.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#33af9c">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body class="messages-page">

  <div class="chat-container">
    <!-- Messages Header -->
    <header class="messages-header">
      <div class="messages-top-bar">
        <a href="index.html" class="back-btn-circle" aria-label="Go Back">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>

        <div class="header-title-wrapper">
          <h1>Messages</h1>
          <span class="unread-subtitle">Your conversations</span>
        </div>

        <button class="compose-btn" aria-label="New Message">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </button>
      </div>

      <!-- Search Input -->
      <div class="messages-search-bar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="#9BA3AF"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" placeholder="Search conversations...">
      </div>
    </header>

    <!-- Recent Chats Body -->
       <!-- Recent Chats Body -->
    <main class="messages-body">
      <span class="section-label">RECENT CHATS</span>

      <div class="chat-list" aria-live="polite">
        <p>Loading conversations…</p>
      </div>
    </main>
    <nav class="messages-bottom-nav" aria-label="Main navigation">
  <a id="messagesNavHome" href="index.html">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/>
    </svg>
    <span>Home</span>
  </a>
  <a id="messagesNavBooking" href="rm-booking.html">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <rect x="3" y="5" width="18" height="16" rx="2"/>
    <path d="M7 3v4m10-4v4M3 11h18"/>
  </svg>
  <span>Booking</span>
</a>

  <a id="messagesNavInbox"
     href="message.html"
     aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 3h16v14H8l-4 4V3Z"/>
      <path d="M8 8h8m-8 4h5"/>
    </svg>
    <span>Message</span>
  </a>

  <a id="messagesNavProfile" href="myprofile.html">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="7" r="4"/>
      <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
    </svg>
    <span>Profile</span>
  </a>
</nav>
  </div>

<script>
  // Set the correct bottom bar before Firebase starts loading.
  const messageView = new URLSearchParams(location.search).get("from");

  if (messageView !== "provider") {
    const nav = document.querySelector(".messages-bottom-nav");

    if (nav) {
      nav.className = "bottom-nav";
      nav.setAttribute("aria-label", "Main navigation");

      nav.innerHTML = `
        <a href="index.html" class="nav-item">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
          <span>Home</span>
        </a>

        <a href="search.html" class="nav-item">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 1 0 14 15l.27.28v.79L20 21.5l1.5-1.5-6-6zM9.5 14a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/>
          </svg>
          <span>Search</span>
        </a>

        <a href="post.html" class="fab-btn" aria-label="Post a Request">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
        </a>

        <a href="mybooking.html" class="nav-item">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
          </svg>
          <span>Booking</span>
        </a>

        <a href="myprofile.html" class="nav-item">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <span>Profile</span>
        </a>
      `;
    }
  }
</script>
<script type="module" src="js/reparo-app.js"></script>
</body>
</html>
