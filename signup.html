<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REPARO - Sign Up</title>

    <link rel="stylesheet" href="styles.css">
   
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#33af9c">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>

<body class="signup-page">

    <main class="signup-container">

        <!-- HEADER -->
        <section class="signup-header">

            <div class="signup-logo">
                <img src="logo.png" alt="REPARO Logo">
            </div>

            <h1>REPARO</h1>

            <p>Your trusted Repair Services.</p>

        </section>


        <!-- FORM AREA -->
        <section class="signup-form-container">

            <form id="signupForm">

                <!-- FULL NAME -->
                <div class="signup-field">

                    <label for="fullName">Full Name</label>

                    <div class="signup-input-wrapper">

                        <svg viewBox="0 0 24 24">
                            <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/>
                        </svg>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Juan Dela Cruz"
                            autocomplete="name"
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->
                <div class="signup-field">

                    <label for="email">Email Address</label>

                    <div class="signup-input-wrapper">

                        <svg viewBox="0 0 24 24">
                            <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
                        </svg>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@gmail.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->
                <div class="signup-field">

                    <label for="password">Password</label>

                    <div class="signup-input-wrapper">

                        <svg viewBox="0 0 24 24">
                            <path d="M17 8h-1V6a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-5 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm2-9h-4V6a2 2 0 0 1 4 0v2z"/>
                        </svg>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="signup-password-toggle"
                            id="toggleSignupPassword"
                            aria-label="Show password"
                        >
                            
                        </button>

                    </div>

                    <!-- SHORT PASSWORD NOTE -->
                    <p class="password-hint">
                        8 characters min • number • special (#)
                    </p>

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="signup-field">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="signup-input-wrapper">

                        <svg viewBox="0 0 24 24">
                            <path d="M17 8h-1V6a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-5 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm2-9h-4V6a2 2 0 0 1 4 0v2z"/>
                        </svg>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                    </div>

                </div>


                <!-- FIREBASE MESSAGE -->
                <p id="signupStatus"></p>


                <!-- CREATE ACCOUNT -->
                <button
                    type="submit"
                    class="signup-btn"
                >
                    Create Account
                </button>


                <!-- LOGIN -->
                <p class="login-text">

                    Already have an account?

                    <a href="./login.html">
                        Log In
                    </a>

                </p>


                <!-- DIVIDER -->
                <div class="signup-divider">

                    <span></span>

                    <p>or</p>

                    <span></span>

                </div>


                <!-- GOOGLE SIGNUP -->
                <button
                    type="button"
                    id="googleSignupBtn"
                    class="google-signup-btn"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            fill="#4285F4"
                            d="M21.35 12.27c0-.79-.07-1.54-.2-2.27H12v4.3h5.23a4.47 4.47 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.92-4.18 2.92-7.39z"
                        />

                        <path
                            fill="#34A853"
                            d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.43c-.87.58-1.99.92-3.31.92-2.54 0-4.69-1.72-5.46-4.02H3.3v2.52A9.75 9.75 0 0 0 12 21.75z"
                        />

                        <path
                            fill="#FBBC05"
                            d="M6.54 13.86A5.86 5.86 0 0 1 6.23 12c0-.65.11-1.28.31-1.86V7.62H3.3A9.74 9.74 0 0 0 2.25 12c0 1.57.38 3.06 1.05 4.38l3.24-2.52z"
                        />

                        <path
                            fill="#EA4335"
                            d="M12 6.13c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.23 14.63 2.25 12 2.25A9.75 9.75 0 0 0 3.3 7.62l3.24 2.52c.77-2.3 2.92-4.01 5.46-4.01z"
                        />

                    </svg>

                    <span>Sign up with Google</span>

                </button>

            </form>

        </section>

    </main>


    <script
        type="module"
        src="js/signup-page.js"
    ></script>

</body>

</html>
