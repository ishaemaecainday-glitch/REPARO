<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REPARO - Reset Password</title>

    <link rel="stylesheet" href="styles.css">
   <link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#33af9c">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>

<body class="login-page">

    <div class="app-container">

        <div class="brand-section">

            <div class="login-logo">
                <img src="logo.png" alt="REPARO Logo">
            </div>

            <h1 class="brand-name">REPARO</h1>

            <p class="brand-slogan">
                Create your new password.
            </p>

        </div>


        <div class="form-section">

            <form id="resetPasswordForm">


                <!-- EMAIL -->

                <div class="input-group">

                    <label class="input-label">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="email"
                            id="resetEmail"
                            class="input-control"
                            readonly
                        >

                    </div>

                </div>


                <!-- NEW PASSWORD -->

                <div class="input-group">

                    <label
                        for="newPassword"
                        class="input-label"
                    >
                        New Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            class="input-control"
                            placeholder="Enter new password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                    <small>
                        Min. 8 characters • number • special (#)
                    </small>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label
                        for="confirmNewPassword"
                        class="input-label"
                    >
                        Confirm New Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="confirmNewPassword"
                            class="input-control"
                            placeholder="Confirm new password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                </div>


                <p
                    id="resetStatus"
                    style="font-size:12px;margin-bottom:14px;"
                ></p>


                <button
                    type="submit"
                    class="btn-submit"
                >
                    Change Password
                </button>


                <div class="signup-row">

                    <a
                        href="./login.html"
                        class="signup-link"
                    >
                        Back to Log In
                    </a>

                </div>

            </form>

        </div>

    </div>


    <script
        type="module"
        src="js/reset-password.js"
    ></script>

</body>

</html>
