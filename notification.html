<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Reparo</title>
    <link rel="stylesheet" href="styles.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#33af9c">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
    <div class="app-container">
        <header class="page-header">
    <div class="header-left">
        <!-- Back button linked directly to index.html -->
        <a href="index.html" class="back-btn" aria-label="Go Back">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>
        <div class="header-titles">
            <h1>Notifications</h1>
            <p class="subtitle">Your notifications</p>
        </div>
    </div>
    <button class="mark-read-btn">Mark all read</button>
</header>

        <main class="content">
            <!-- Filter Chips -->
            <div class="filter-chips">
                <button class="chip active">All</button>
                <button class="chip">Bookings</button>
                <button class="chip">Messages</button>
            </div>

            <!-- Notifications List -->
          <div class="notifications-list">
  <p>Loading notifications…</p>
</div>

            </div>
        </main>
    </div>

<script type="module" src="js/reparo-app.js"></script>
</body>
</html>
