<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reparo - Login</title>
  <script>
  let showWelcome = true;

  try {
    showWelcome =
      new URLSearchParams(location.search).has("welcome") ||
      !sessionStorage.getItem("reparoWelcomeSeen");
  } catch {}

  if (showWelcome) {
    document.documentElement.classList.add("show-reparo-welcome");
  }
</script>
    <link rel="stylesheet" href="styles.css">
   <link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#33af9c">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body class="login-page">
    <section
  class="reparo-welcome"
  aria-labelledby="welcomeTitle"
  hidden
>
  <div class="welcome-orbit" aria-hidden="true"></div>

  <div class="welcome-content">
    <div class="welcome-logo">
      <img src="logo.png" alt="REPARO logo">
    </div>

    <h1 id="welcomeTitle">REPARO</h1>
    <p class="welcome-tagline">YOUR TRUSTED REPAIR SERVICES</p>

    <div class="welcome-divider" aria-hidden="true">
      <span></span>
      <i></i>
      <span></span>
    </div>

    <div class="welcome-features">
      <span>Fast</span>
      <span>Reliable</span>
      <span>Affordable</span>
    </div>

    <button type="button" id="welcomeContinue">
      Continue
      <span aria-hidden="true">→</span>
    </button>
  </div>
</section>

    <div class="app-container">
      
        <div class="brand-section">
                     <div class="login-logo">

                <img
                    src="logo.png"
                    alt="REPARO Logo"
                >

            </div>
            <h1 class="brand-name">REPARO</h1>
            <p class="brand-slogan">Your trusted Repair Services.</p>
        </div>

      
        <div class="form-section">
            <form id="loginForm">
                
              
                <div class="input-group">
                    <label for="email" class="input-label">Email Address</label>
                    <div class="input-wrapper">
                        <svg class="input-icon-left" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        <input type="email" id="email" class="input-control" placeholder="you@gmail.com" required>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="input-group">
                    <label for="password" class="input-label">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon-left" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg>
                        <input type="password" id="password" class="input-control" placeholder="••••••••" required>
                        
                        <!-- Toggle Password Button -->
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Checkbox -->
                <div class="legal-row">
                    <input type="checkbox" id="terms" class="custom-checkbox">
                    <label for="terms" class="legal-text">
                        I agree to the <a href="#">Terms of Services</a> and <a href="#">Privacy Policy</a>
                    </label>
                </div>

                <a href="#" class="forgot-password">Forgot password?</a>

                <button type="submit" class="btn-submit">Log In</button>
                <p id="authStatus" style="font-size:12px;margin:-8px 0 14px;"></p>

                <div class="signup-row">
                   Don't have an account? <a href="./signup.html" class="signup-link">Sign Up</a>
                   
                </div>

                <div class="divider">
                    <span>or</span>
                </div>

                <!-- Google Button -->
                <button type="button" class="btn-google" id="googleBtn">
                    <svg viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    Continue with Google
                </button>

            </form>
        </div>
    </div>
    <script>
  (() => {
    const root = document.documentElement;
    if (!root.classList.contains("show-reparo-welcome")) return;

    const button = document.getElementById("welcomeContinue");
    let timer;

    function openLogin() {
      const moveFocus = document.activeElement === button;

      clearTimeout(timer);
      root.classList.remove("show-reparo-welcome");

      try {
        sessionStorage.setItem("reparoWelcomeSeen", "true");
      } catch {}

      if (moveFocus) {
        document.querySelector(
          '.app-container input[type="email"]'
        )?.focus();
      }
    }

    button.addEventListener("click", openLogin, { once: true });
    timer = setTimeout(openLogin, 3500);
  })();
</script>
<script type="module" src="js/auth-page.js"></script>
</body>
</html>
