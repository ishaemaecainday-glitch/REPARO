<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reparo - Search Results</title>
    <link rel="stylesheet" href="styles.css">
   
    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

    #searchMap {
        width: calc(100% - 32px);
        height: 240px;
        margin: 14px 16px;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        background: #f3f4f6;
    }

    .map-location-status {
        margin: 0 16px 10px;
        font-size: 12px;
        color: #667085;
    }

    .sort-chip {
        cursor: pointer;
    }

    .provider-distance {
        font-size: 12px;
        color: #667085;
    }

</style>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#33af9c">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>

    <div class="mobile-wrapper">
        <!-- Top Search Bar Header -->
        <header class="results-header">
            <div class="search-row">
                <a href="search.html" class="back-btn" aria-label="Go back">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </a>
                <div class="search-input-wrapper">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" value="">
                </div>
            </div>
            <div class="results-count"></div>
        </header>
<nav class="results-categories" aria-label="Service categories">
  <a href="search-results.html?nearby=1">All</a>
  <a href="search-results.html?q=Electrician">Electrician</a>
  <a href="search-results.html?q=AC%20Repair">AC Repair</a>
  <a href="search-results.html?q=Plumber">Plumber</a>
  <a href="search-results.html?q=Appliance">Appliance</a>
  <a href="search-results.html?q=Carpenter">Carpenter</a>
  <a href="search-results.html?q=Auto%20tech">Auto tech</a>
  <a href="search-results.html?q=Gadget%20Tech">Gadget Tech</a>
  <a href="search-results.html?q=Locksmith">Locksmith</a>
  <a href="search-results.html?q=Roofing">Roofing</a>
<a href="search-results.html?q=Welder">Welder</a>
<a href="search-results.html?q=Others">Others</a>
</nav>
   <!-- Sorting Chips -->
<div class="sort-bar">
  <span class="sort-label">Sort:</span>

<button type="button" class="sort-chip chip-inactive" data-sort="rating">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="m12 2 3.1 6.3 7 .9-5.1 4.9 1.2 6.9-6.2-3.3-6.2 3.3 1.2-6.9L2 9.2l7-.9L12 2Z"/>
  </svg>
  Top Rated
</button>

  <button type="button" class="sort-chip chip-active" data-sort="nearest">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
      <circle cx="12" cy="10" r="2.5"/>
    </svg>
    Nearest
  </button>

  <button type="button" class="sort-chip chip-inactive" data-sort="price">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 11V4h7l11 11-7 7L3 11Z"/>
      <circle cx="7.5" cy="7.5" r="1"/>
    </svg>
    Price
  </button>
</div>

<!-- Provider Results List -->
<main class="results-list" id="providerResultsList">
    <p style="padding:25px; text-align:center; color:#94a3b8;">
        Finding verified providers...
    </p>
</main>

<p id="nearbyStatus" class="nearby-status" role="status">
  Finding providers near your current location…
</p>

<button id="nearbyRetry" type="button" hidden>
  Try location again
</button>
        <!-- Floating Chat Icon -->
        <button class="floating-chat" aria-label="Open Chat">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
           
        </button>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </a>
            <a href="search.html" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <span>Search</span>
            </a>
            <button class="nav-item add-btn" aria-label="Add Action">
                <div class="plus-icon">+</div>
            </button>
            <a href="mybooking.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
                <span>Booking</span>
            </a>
            <a href="myprofile.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>Profile</span>
            </a>
        </nav>
    </div>


<script>

  const source = new URLSearchParams(location.search).get("from");

  const backArrow = document.querySelector(
    "header a.back-btn, header a.back-button, header a[href='search.html']"
  );

  if (
    backArrow &&
    (
      source === "home" ||
      new URLSearchParams(location.search).get("nearby") === "1"
    )
  ) {
    backArrow.href = "index.html";
    backArrow.setAttribute("aria-label", "Back to home");
  } else if (backArrow && source === "categories") {
    backArrow.href = "categories.html";
    backArrow.setAttribute(
      "aria-label",
      "Back to service categories"
    );
  }
</script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/reparo-app.js"></script>
</body>
</html>
