<!DOCTYPE html>
<html lang="en">

<head>
    
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Post a Service Request</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
    <link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#33af9c">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<style>
#postLocationTitle {
  display: block;
  max-width: 100%;
  margin: 10px 0 6px;
  color: #164e45;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.6;
  white-space: normal;
  overflow-wrap: anywhere;
}

#postLocationStatus {
  margin: 12px 0 0;
  font-size: 12px;
  line-height: 1.6;
}

#locationSourceCredit {
  margin: 10px 0 0;
  text-align: center;
  font-size: 10px;
  line-height: 1.5;
}

#locationSourceCredit a {
  color: #64748b;
  text-decoration: none;
}
</style>
<body class="post-request-page">

    <div class="mobile-container">

        <!-- HEADER -->
        <header class="page-header">

            <a
                href="index.html"
                class="back-btn"
                aria-label="Go back"
            >

                <svg viewBox="0 0 24 24">

                    <path
                        d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
                    />

                </svg>

            </a>


            <div class="header-text">

                <h1>
                    Post a Service Request
                </h1>

                <p>
                    Nearby providers will see and respond to your request.
                </p>

            </div>

        </header>



        <!-- ======================================
             REQUEST FORM
        ======================================= -->

        <form
            class="request-form"
            id="requestForm"
        >


            <!-- SERVICE NEEDED -->

            <label class="section-label">
                Service Needed *
            </label>


            <div class="service-grid">


                <!-- ELECTRICIAN -->

                <label class="service-card">

                    <input
                        type="radio"
                        name="service"
                        value="electrician"
                    >

                    <div class="card-content">

                        <svg
                            class="icon-electrician"
                            viewBox="0 0 24 24"
                        >
                            <path
                                d="M7 2v11h3v9l7-12h-4l4-8z"
                            />
                        </svg>

                        <span>
                            Electrician
                        </span>

                    </div>

                </label>



                <!-- AC REPAIR -->

                <label class="service-card">

                    <input
                        type="radio"
                        name="service"
                        value="ac_repair"
                    >

                    <div class="card-content">

                        <svg
                            class="icon-ac"
                            viewBox="0 0 24 24"
                        >
                            <path
                                d="M19 3H5c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 10H5V5h14v8zm-7 3c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
                            />
                        </svg>

                        <span>
                            AC Repair
                        </span>

                    </div>

                </label>



                <!-- PLUMBER -->

                <label class="service-card">

                    <input
                        type="radio"
                        name="service"
                        value="plumber"
                    >

                    <div class="card-content">

                        <svg
                            class="icon-plumber"
                            viewBox="0 0 24 24"
                        >
                            <path
                                d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"
                            />
                        </svg>

                        <span>
                            Plumber
                        </span>

                    </div>

                </label>



                <!-- APPLIANCE -->

                <label class="service-card">

                    <input
                        type="radio"
                        name="service"
                        value="appliance"
                    >

                    <div class="card-content">

                        <svg
                            class="icon-appliance"
                            viewBox="0 0 24 24"
                        >
                            <path
                                d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"
                            />
                        </svg>

                        <span>
                            Appliance
                        </span>

                    </div>

                </label>



                <!-- CARPENTER -->

                <label class="service-card">

                    <input
                        type="radio"
                        name="service"
                        value="carpenter"
                    >

                    <div class="card-content">

                        <svg
                            class="icon-carpenter"
                            viewBox="0 0 24 24"
                        >
                            <path
                                d="M13.78 15.3l1.41 1.41 2.12-2.12 3.53 3.53-1.41 1.42 1.41 1.41 2.83-2.83-1.41-1.41 1.41-1.41-3.53-3.54 2.12-2.12-1.41-1.41-7.07 7.07zm-4.24-4.24L3 17.58V21h3.42l6.52-6.52-3.4-3.42z"
                            />
                        </svg>

                        <span>
                            Carpenter
                        </span>

                    </div>

                </label>



                <!-- AUTO TECH -->

                <label class="service-card">

                    <input
                        type="radio"
                        name="service"
                        value="auto_tech"
                    >

                    <div class="card-content">

                        <svg
                            class="icon-auto"
                            viewBox="0 0 24 24"
                        >

                            <path
                                d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"
                            />

                        </svg>

                        <span>
                            Auto Tech
                        </span>

                    </div>

                </label>



                <!-- GADGET TECH -->

                <label class="service-card">

                    <input
                        type="radio"
                        name="service"
                        value="gadget_tech"
                    >

                    <div class="card-content">

                        <svg
                            class="icon-gadget"
                            viewBox="0 0 24 24"
                        >

                            <path
                                d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"
                            />

                        </svg>

                        <span>
                            Gadget Tech
                        </span>

                    </div>

                </label>



                <!-- LOCKSMITH -->

                <label class="service-card">

                    <input
                        type="radio"
                        name="service"
                        value="locksmith"
                    >

                    <div class="card-content">

                        <svg
                            class="icon-locksmith"
                            viewBox="0 0 24 24"
                        >

                            <path
                                d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"
                            />

                        </svg>

                        <span>
                            Locksmith
                        </span>

                    </div>

                </label>



                <!-- ROOFING -->

                <label class="service-card">

                    <input
                        type="radio"
                        name="service"
                        value="roofing"
                    >

                    <div class="card-content">

                        <svg
                            class="icon-roofing"
                            viewBox="0 0 24 24"
                        >

                            <path
                                d="M19 9.3V4h-3v2.6L12 3 2 12h3v8h5v-6h4v6h5v-8h3l-3-2.7z"
                            />

                        </svg>

                        <span>
                            Roofing
                        </span>

                    </div>

                </label>



                <!-- WELDER -->

                <label class="service-card">

                    <input
                        type="radio"
                        name="service"
                        value="welder"
                    >

                    <div class="card-content">

                        <svg
                            class="icon-welder"
                            viewBox="0 0 24 24"
                        >

                            <path
                                d="M22 19h-2v-4h-2v4h-2v-6h-2v6h-2v-8H8v8H2v2h20v-2zM12 3c-1.1 0-2 .9-2 2v4h4V5c0-1.1-.9-2-2-2z"
                            />

                        </svg>

                        <span>
                            Welder
                        </span>

                    </div>

                </label>

            </div>



            <!-- REQUEST TITLE -->

            <div class="form-group">

                <label for="requestTitle">
                    Request Title *
                </label>

                <input
                    type="text"
                    id="requestTitle"
                    placeholder="e.g. Need an Electrician ASAP"
                    required
                >

            </div>



            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">
                    Description *
                </label>

                <textarea
                    id="description"
                    maxlength="500"
                    placeholder="Describe the problem you want to solve"
                    required
                ></textarea>

                <span class="char-count">
                    0/500
                </span>

            </div>



            <!-- LOCATION -->
<div class="form-group">
  <label id="postLocationLabel">Your Location *</label>

  <div class="post-location-panel">
    <button
      type="button"
      id="detectPostLocation"
      aria-labelledby="postLocationLabel postLocationTitle"
    >
      <span class="post-location-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
        </svg>
      </span>

      <strong id="postLocationTitle">Tap to Detect My Location</strong>
      <span class="post-location-hint">
        Use your device GPS to pinpoint your area
      </span>
    </button>

    <div id="postLocationMapWrap" hidden>
      <div id="postLocationMap" aria-label="Your request location"></div>
    </div>

    <p id="postLocationStatus" role="status"></p>
  </div>

  <input type="hidden" id="location" name="location">
</div>

            <!-- BUDGET -->

            <div class="form-group">

                <label for="budget">
                    Budget (optional)
                </label>

                <input
                    type="text"
                    id="budget"
                    placeholder="e.g. ₱500 - ₱1,000"
                >

            </div>



            <!-- FIREBASE STATUS -->

            <p
                id="postStatus"
                class="post-status"
            ></p>



            <!-- POST BUTTON -->

            <button
                type="submit"
                class="submit-btn"
                id="postRequestBtn"
            >
                Post Request
            </button>
        </form>

    </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script
        type="module"
        src="js/reparo-app.js"
    ></script>

</body>

</html>
